<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System Timeline Investigation</title>
<style>
:root{
  --ink:#12203a; --muted:#47566e; --mist:#edf1f6; --surface:#ffffff; --line:#c9d3e0;
  --indigo:#2b3a8f; --indigo-d:#1e2a6b; --gold:#e9b63c; --stab:#0e7c7b; --chg:#a3265f;
  --good:#146c3a; --good-bg:#e5f4ea; --bad:#9b1c1c; --bad-bg:#fbeaea; --sky:#dfe8f5;
}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--mist);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:1.7rem} h2{font-size:1.5rem} h3{font-size:1.2rem;margin-top:1.4em}
p{margin:.5em 0 .8em} ul,ol{margin:.4em 0 .9em;padding-left:1.3em} li{margin:.25em 0}
a{color:var(--indigo)}
header.top{background:var(--ink);color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--gold)}
header.top .brand{font:700 1.15rem "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;flex:1 1 auto}
header.top .brand small{display:block;font:400 .78rem system-ui,sans-serif;opacity:.8}
button{font:inherit;cursor:pointer}
.hbtn{background:transparent;color:#fff;border:2px solid #8fa0c0;border-radius:8px;padding:6px 12px;min-height:40px}
.hbtn:hover,.hbtn[aria-pressed=true]{background:#fff;color:var(--ink)}
nav#steps{background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 12px;display:flex;gap:6px;position:sticky;top:68px;z-index:15}
nav#steps button{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:42px;color:var(--ink)}
nav#steps button[aria-current=step]{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:700}
nav#steps button.done:not([aria-current=step]){border-color:var(--good);background:var(--good-bg)}
nav#steps .n{display:inline-block;min-width:1.4em;font-weight:700}
main{max-width:920px;margin:0 auto;padding:22px 16px 80px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 18px}
.lead{font-size:1.1rem;color:var(--muted)}
.goal{border-left:6px solid var(--gold);background:#fff8e6;padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.btn{background:var(--indigo);color:#fff;border:0;border-radius:10px;padding:10px 18px;min-height:46px;font-weight:700}
.btn:hover{background:var(--indigo-d)}
.btn.alt{background:#fff;color:var(--indigo);border:2px solid var(--indigo)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--indigo);text-decoration:underline;padding:6px 0;font-weight:600}
:focus-visible{outline:3px solid #ff8a00;outline-offset:2px}
.q{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:6px}
.q:first-of-type{border-top:0}
.stem{font-weight:600;margin:.2em 0 .6em}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;min-height:48px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--indigo);background:#f3f5ff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-color:#9b1c1c88}
.opt.right{border-color:var(--good);background:var(--good-bg);font-weight:600}
.opt[aria-pressed=true]{border-color:var(--indigo);background:#eef0ff}
.opts.inline{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
body.tmode .opt.iskey{box-shadow:inset 6px 0 0 var(--gold)}
body.tmode .opt.iskey::after{content:" (key)";font-size:.8em;color:var(--muted)}
.fb{margin-top:8px;outline:none}
.fb .good,.fb .bad{border-radius:8px;padding:8px 12px;margin:6px 0}
.fb .good{background:var(--good-bg);color:#0d4a27}
.fb .bad{background:var(--bad-bg);color:#6e1212}
.why{background:var(--sky);border-radius:8px;padding:8px 14px;margin:6px 0}
.why p,.why ul{margin:.3em 0}
.src{font-size:.88rem;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:46px;max-width:100%}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{width:11em}
table.match{border-collapse:collapse;width:100%}
table.match td{padding:6px 8px;vertical-align:middle;border-bottom:1px solid var(--line)}
table.match select{width:100%}
table.match tr.bad select{border-color:var(--bad);background:var(--bad-bg)}
table.match tr.ok select{border-color:var(--good);background:var(--good-bg)}
.badge{display:inline-grid;place-items:center;min-width:2.1em;height:2.1em;border-radius:50%;background:var(--ink);color:#fff;font-weight:700}
ol.order{list-style:none;padding:0;margin:8px 0}
ol.order li{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
ol.order .txt{flex:1 1 auto;font-size:.98rem;line-height:1.4}
ol.order .txt b{display:block;font-size:1.05rem}
ol.order .rank{color:var(--muted);font-weight:700;width:1.6em;text-align:right}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{border:2px solid var(--line);background:#fff;border-radius:8px;min-width:46px;min-height:36px;color:var(--ink)}
.mv button:hover{border-color:var(--indigo);background:#f3f5ff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;color:var(--ink)}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.chip.ok:not(.on){background:var(--good-bg);border-color:var(--good)}
details{margin:8px 0;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.scroll svg{display:block;min-width:720px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.92rem;margin:8px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:26px;height:14px;border-radius:3px}
.sw-chg{background:var(--chg)} .sw-stab{background:var(--stab)}
.sw-both{background:repeating-linear-gradient(45deg,var(--stab) 0 5px,var(--chg) 5px 10px)}
.sw-unk{background:#8a97ab}
.sw-hyp{background:#fff;border:2px dashed var(--ink)}
.slip{border:2px dashed var(--indigo);border-radius:10px;padding:10px 14px;background:#fbfcff;margin:10px 0}
.slip p{margin:.25em 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.note{font-size:.9rem;color:var(--muted)}
.tag{display:inline-block;background:var(--gold);color:var(--ink);border-radius:6px;padding:0 8px;font-size:.82rem;font-weight:700}
dialog,#glossary{max-width:560px}
#glossary{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;border-left:4px solid var(--gold);padding:18px;overflow:auto;z-index:50;box-shadow:-8px 0 24px #0003}
#glossary dt{font-weight:700;margin-top:.7em} #glossary dd{margin:0}
#printArea{display:none}
table.rec{border-collapse:collapse;width:100%;font-size:.8rem;margin:6px 0 14px}
table.rec th,table.rec td{border:1px solid #888;padding:3px 5px;vertical-align:top;text-align:left}
textarea.out{width:100%;min-height:200px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:2px solid var(--line);border-radius:8px}
@media (max-width:640px){body{font-size:17px} main{padding:14px 10px 70px} .panel{padding:14px 12px} header.top{position:static} nav#steps{top:0}}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-size:11pt;color:#000;background:#fff}
  #printArea h1{font-size:16pt} #printArea h2{font-size:13pt;margin-top:12px}
  #printArea svg{width:100%;height:auto;page-break-inside:avoid}
  table.rec{page-break-inside:auto} tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:no-preference){.fb .good,.fb .bad{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(-3px)}to{transform:none}}}
</style>
</head>

  <div class="brand">Solar System Timeline Investigation<small>Solar system evolution &middot; student activity</small></div>
  <button class="hbtn" id="gbtn" aria-expanded="false" aria-controls="glossary">Word bank</button>
  <button class="hbtn" id="tbtn" aria-pressed="false" hidden>Show key on options</button>
</header>
<nav id="steps" aria-label="Activity steps"></nav>
<main id="app" tabindex="-1"></main>
<aside id="glossary" hidden aria-label="Word bank"></aside>
<div id="printArea" aria-hidden="true"></div>

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>String(h).replace(/<[^>]+>/g,"");
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,key){const r=rng(hash(key+S.seed)),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  s+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#47566e"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#47566e"/>`;

function checkBuild(id){
  const c=BYID[id],t=S.tl[id];if(!t)return;
  if(id==="L"&&!S.lm){t.msg=["Choose the <b>Early</b> or <b>Delayed</b> model for card L first."];t.ok=false;return}
  const r=refOf(c),P=[];let ds,de,okS,okE;
  if(id==="C"){ds=t.s>0.3?t.s-3.8:0;okS=Math.abs(ds)<=0.4;de=t.e;okE=t.e<=0.05}
  else{ds=t.s-r.s;de=t.e-r.e;okS=Math.abs(ds)<=r.tol;okE=Math.abs(de)<=r.tol}
  if(!okS)P.push(ds>0?"Your <b>start</b> is too old. It sits too far left. Larger BYA is older.":"Your <b>start</b> is too young. It sits too far right.");
  if(!okE)P.push(de>0?"Your <b>end</b> is too old. It sits too far left.":"Your <b>end</b> is too young. It sits too far right.");
  if((!okS||!okE)&&id!=="C"&&(r.s-r.e)<0.06&&t.view!=="inset")P.push("This card covers a very short time. Place it in the <b>Inset</b> so you can be exact.");
  if(!t.type)P.push("Pick a <b>type</b>: change, increasing stability, or both.");
  else if(t.type!==c.type)P.push("Your <b>type</b> needs another look. Hint: ask what changes and what gets steadier."+(t.tries>=1?" "+c.typeWhy:""));
  if(id==="E"&&!t.hyp)P.push("Card E is debated. Mark it as a <b>hypothesis</b>.");
  if(id!=="E"&&id!=="L"&&t.hyp)P.push("This card is not a hypothesis. Turn the label off.");
  t.tries=(t.tries||0)+1;
  if(P.length){t.ok=false;t.msg=P;if(t.tries>=2){t.target=true;P.push("Target: "+fmtRange(c)+". The gold dashed box on the timeline shows it.")}}
  else{t.ok=true;t.msg=[];t.target=false}
}

  L.push("Name: "+(S.name||"(no name)")+"   Date: "+date+"   Lesson: "+(full()?"Full (12 cards)":"Short (9 cards)"));
  L.push("");L.push("CARD RECORDS (date or range | evidence | source | placement reason)");
  recRows().forEach(r=>{L.push(r.id+" "+r.t+" ["+typeLabel[BYID[r.id].type]+"; tries "+r.tries+"]");L.push("   date: "+(r.did?r.date:"(not finished)")+" | evidence: "+(r.did?r.ev:"")+" | source: "+r.src+" | placement: "+(r.did?r.reason:""));});
  L.push("");L.push("TIMELINE I BUILT (start to end in BYA | type)");
  cardsInMode().forEach(c=>{const t=S.tl[c.id];L.push(c.id+" "+c.short+": "+(t?(t.s.toFixed(3)+" to "+(t.e<=0.0005?"today":t.e.toFixed(3))+" BYA | "+({change:"Change",stability:"Increasing stability",both:"Both"}[t.type]||"no type")+(t.hyp?" | hypothesis":"")+(t.ok?(t.shown?" | answer shown":" | checked"):" | not checked")):"(not placed)"))});
  L.push("");L.push("ORDER I PREDICTED (oldest first): "+(S.order?S.order.join(" "):"(not done)"));
  const w=curWindow();L.push("INSET WINDOW: "+(w?w.t:"(not chosen)"));
  if(full())L.push("GIANT PLANET MODEL FOR CARD L: "+(S.lm?(S.lm==="early"?"Early":"Delayed (needs a cited alternative)"):"(not chosen)"));
  L.push("E is labeled: Hypothesis"+(done("p3")?"":" (not finished)"));
  L.push("");L.push("BRIDGES (process | cause | time | evidence | source)");
  bridgeRows().forEach(({b,done:d})=>{L.push(b.chain+" ["+strip(b.kind).split(" (")[0]+"]"+(d?"":" (not finished)"));if(d)L.push("   "+b.title+" | "+strip(b.cause.ok)+" | "+strip(b.time.ok)+" | "+strip(b.evid.ok)+" | "+srcNums(b.src))});
  L.push("");L.push("ASSESSMENT");
  ["as1","as2","as3","as4","tf1","tf2","tf3","tf4","f1","f2","f3","f4","f5"].forEach(id=>{const q=Q[id];L.push("- "+strip(q.stem)+" -> "+pickText(id))});
  return L.join("\n");
}
function reportHTML(){
  const rows=recRows(),cs=cardsInMode(),w=curWindow();
  let h=`<h1>Solar System Timeline Investigation</h1><p><b>Name:</b> ${esc(S.name||"(no name)")} &nbsp; <b>Date:</b> ${esc(new Date().toLocaleDateString())} &nbsp; <b>Lesson:</b> ${full()?"Full (12 cards)":"Short (9 cards)"}</p>`;
  h+=`<h2>My timeline</h2>${tlSVG({hi:4.6,lo:0,rows:cs,mark:(w&&w.lo>0)?w:null,label:"Full timeline"})}`;
  if(w&&w.lo>0){const m=winMetrics(w);h+=`<h2>Inset: ${esc(w.t)} (zoom ×${m.zoom})</h2>${tlSVG({hi:w.hi,lo:w.lo,rows:cs.filter(c=>!m.out.includes(c.id)),label:"Inset"})}`}
  h+=`<h2>Card records</h2><table class="rec"><thead><tr><th>Card</th><th>Date or range</th><th>Type</th><th>Evidence</th><th>Source</th><th>Placement reason</th></tr></thead><tbody>`+rows.map(r=>`<tr><td><b>${r.id}</b> ${esc(r.t)}</td><td>${r.did?esc(r.date):"(not finished)"}</td><td>${r.tid?esc(r.type):"(not finished)"}</td><td>${r.did?esc(r.ev):""}</td><td>${r.src}</td><td>${r.did?esc(r.reason):""}</td></tr>`).join("")+`</tbody></table>`;
  h+=`<h2>Bridges</h2><table class="rec"><thead><tr><th>Between</th><th>Type</th><th>Process</th><th>Cause</th><th>Time</th><th>Evidence</th><th>Source</th></tr></thead><tbody>`+bridgeRows().map(({b,done:d})=>`<tr><td>${esc(b.chain)}</td><td>${esc(strip(b.kind).split(" (")[0])}</td>${d?`<td>${esc(b.title)}</td><td>${esc(strip(b.cause.ok))}</td><td>${esc(strip(b.time.ok))}</td><td>${esc(strip(b.evid.ok))}</td><td>${srcNums(b.src)}</td>`:`<td colspan="5">(not finished)</td>`}</tr>`).join("")+`</tbody></table>`;
  h+=`<h2>Assessment</h2><ul>`+["as1","as2","as3","as4","tf1","tf2","tf3","tf4","f1","f2","f3","f4","f5"].map(id=>`<li>${esc(strip(Q[id].stem))}<br><b>${esc(pickText(id))}</b></li>`).join("")+`</ul>`;
  h+=`<h2>Sources</h2><ul>`+Object.keys(SRC).map(n=>`<li>[${n}] ${esc(SRC[n][0])} — ${esc(SRC[n][1])}</li>`).join("")+`</ul>`;
  return h;
}


/* ================= RENDER + EVENTS ================= */
const app=$("#app");
function renderSteps(){
  $("#steps").innerHTML=STEPS.map((s,i)=>`<button type="button" data-act="go" data-s="${i}" class="${stepDone(i)?"done":""}" ${i===S.step?'aria-current="step"':""}><span class="n">${stepDone(i)&&i!==S.step?"✓":i+1}</span> ${s.n}</button>`).join("");
}
function render(){app.innerHTML=V[STEPS[S.step].k]();renderSteps();save()}
function rr(qid,focusSel){ // re-render, keep scroll, restore focus
  const y=window.scrollY;render();window.scrollTo(0,y);
  let el=null;
  if(focusSel&&qid)el=$(`[data-qid="${qid}"] ${focusSel}`);
  else if(qid)el=$(`[data-qid="${qid}"] .fb`);
  if(el)el.focus({preventScroll:true});
}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));render();window.scrollTo(0,0);app.focus({preventScroll:true})}

A.go=b=>go(+b.dataset.s);
A.begin=()=>{const nm=$("[data-name]");if(nm)S.name=nm.value.trim();S.started=true;go(1)};
A.reset=()=>{if(confirm("Erase all of your work on this device and start over?")){const nm=S.name;S=fresh();S.name=nm;save();render();window.scrollTo(0,0)}};
A.mv=b=>{const i=+b.dataset.i,d=+b.dataset.d,j=i+d;if(j<0||j>=S.order.length)return;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];S.orderMsg=[];render();const nb=$(`[data-act=mv][data-i="${j}"][data-d="${d}"]`);if(nb)nb.focus({preventScroll:false})};
A.chkorder=()=>{
  const pos={};S.order.forEach((id,i)=>pos[id]=i);
  const bad=CONS.filter(([a,b])=>pos[a]!==undefined&&pos[b]!==undefined&&pos[a]>pos[b]);
  S.orderChecks++;
  if(!bad.length){S.orderDone=true;S.orderMsg=[]}
  else S.orderMsg=bad.slice(0,2).map(([a,b,why])=>`Look at <b>${a}</b> and <b>${b}</b>. Hint: ${why}`);
  render();const f=$(".fb");if(f)f.focus({preventScroll:true});
};
A.showorder=()=>{const k=ORDER_KEY_FULL.filter(i=>cardsInMode().some(c=>c.id===i));S.order=k;S.orderDone=true;S.orderShown=true;S.orderMsg=[];render()};
A.card=b=>{S.cur=b.dataset.id;if(b.dataset.go4){go(3);return}render();window.scrollTo(0,0)};
A.chart=b=>{S.chart=b.dataset.v;render()};
A.lm=b=>{if(S.lm!==b.dataset.v&&S.tl.L)S.tl.L.ok=false;S.lm=b.dataset.v;render()};
function rb(focusFb){const y=window.scrollY;render();window.scrollTo(0,y);if(focusFb){const f=$("#fb5");if(f)f.focus({preventScroll:true})}}
A.selrow=b=>{S.sel5=b.dataset.id;const y=window.scrollY;render();window.scrollTo(0,y);const c=$("#ctl5");if(c&&b.tagName.toLowerCase()!=="button")c.scrollIntoView({block:"nearest",behavior:"smooth"})};
A.addcard=()=>{const v=dView(),st=vStep(v),N=Math.round((v.hi-v.lo)/st);S.tl[S.sel5]={s:r4(v.hi-st*Math.round(N*0.25)),e:r4(v.hi-st*Math.round(N*0.35)),type:null,hyp:false,ok:false,tries:0,msg:[],view:S.bview};rb()};
A.rem5=()=>{delete S.tl[S.sel5];rb()};
A.bview=b=>{S.bview=b.dataset.v;rb()};
A.settype=b=>{const t=S.tl[S.sel5];if(!t)return;t.type=b.dataset.v;t.ok=false;rb()};
A.lm5=b=>{if(S.lm!==b.dataset.v&&S.tl.L)S.tl.L.ok=false;S.lm=b.dataset.v;rb()};
A.chk5=()=>{checkBuild(S.sel5);rb(true)};
A.show5=()=>{const c=BYID[S.sel5],t=S.tl[S.sel5];if(!t)return;if(c.id==="L"&&!S.lm)S.lm="early";const r=refOf(c);t.s=c.id==="C"?3.8:r.s;t.e=c.id==="C"?0:r.e;t.type=c.type;t.hyp=c.id==="E";t.ok=true;t.shown=true;t.target=false;t.msg=[];rb(true)};
A.print=()=>{$("#printArea").innerHTML=reportHTML();window.print()};
A.copy=async()=>{const t=reportText();const msg=$("#copymsg");let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const ta=$("#repout");if(ta){ta.focus();ta.select();try{ok=document.execCommand("copy")}catch(e2){}}}
  if(msg){msg.textContent=ok?"Copied! Paste it into Canvas.":"Could not copy. Select the text in the box and copy it.";msg.focus({preventScroll:true})}};
A.dl=()=>{const blob=new Blob([reportText()],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="solar-system-timeline-"+(S.name||"student").replace(/[^a-z0-9]+/gi,"-")+".txt";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b,e)});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("[data-match]")){const a=ans(t.dataset.match);a.m=a.m||{};a.m[t.dataset.row]=t.value;save()}
  else if(t.matches("[data-hyp]")){const tl=S.tl[S.sel5];if(tl){tl.hyp=t.checked;tl.ok=false;rb()}}
  else if(t.matches("[data-name]")){S.name=t.value.trim();save()}
  else if(t.name==="mode"){S.mode=t.value;save();renderSteps()}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.matches("[data-name]")){S.name=t.value.trim();save()}
  else if(t.matches("[data-sl]")){const tl=S.tl[S.sel5];if(!tl)return;const v=dView(),st=vStep(v),val=r4(v.hi-(+t.value)*st);
    if(t.dataset.sl==="s"){tl.s=val;if(tl.e>tl.s)tl.e=tl.s}else{tl.e=val;if(tl.s<tl.e)tl.s=tl.e}
    tl.ok=false;tl.target=false;tl.view=S.bview;save();liveBuild()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("[data-num]")){e.preventDefault();const b=$(`[data-act=checknum][data-id="${e.target.dataset.num}"]`);if(b)b.click()}
  if(e.key==="Escape"&&!$("#glossary").hidden){$("#gbtn").click()}
});

/* word bank */
$("#glossary").innerHTML=`<button class="btn alt" type="button" id="gclose">Close</button><h2 style="margin-top:12px">Word bank</h2><dl>${GLOSS.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl><h3>Sources</h3><p class="note">These are optional links. Your work is not sent anywhere.</p><ul class="src">${Object.keys(SRC).map(n=>`<li>${srcLinks([+n])}</li>`).join("")}</ul>`;
$("#gbtn").addEventListener("click",()=>{const g=$("#glossary"),open=g.hidden;g.hidden=!open;$("#gbtn").setAttribute("aria-expanded",String(open));if(open)$("#gclose").focus()});
$("#gclose").addEventListener("click",()=>{$("#glossary").hidden=true;$("#gbtn").setAttribute("aria-expanded","false");$("#gbtn").focus()});

render();
})();
</script>
